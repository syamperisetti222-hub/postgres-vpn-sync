# PostgreSQL VPN Sync Configuration

local_database:
  host: "localhost"
  port: 5432
  database: "postgres"
  username: "postgres"
  password: "local_password"

master_database:
  host: "10.10.10.10"
  port: 5432
  database: "postgres"
  username: "postgres"
  password: "master_password"

sync:
  schemas:
    - "public"

  batch_size: 1000

# VPN Configuration (Reference only - VPN setup is infrastructure)
vpn:
  enabled: true
  connection_name: "Master VPN"
  master_vpn_ip: "10.10.10.10"
  note: "VPN must be established before running sync"
